<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>복제인간 시</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #080808; color: #eae8e1; }
    #unity-container { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
    #unity-canvas { display: block; background: #080808; }
    #unity-footer { height: 36px; display: flex; align-items: center; justify-content: flex-end; }
    #unity-fullscreen-button, .retry { color: #bbb9b2; background: transparent; border: 1px solid #555; padding: 6px 12px; cursor: pointer; }
    button:focus-visible { outline: 2px solid #eae8e1; outline-offset: 4px; }
    #unity-loading-bar { position: fixed; inset: 0; z-index: 10; background: #080808; }
    .loading-content { position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%); width: min(80vw, 340px); text-align: center; }
    h1 { margin: 0 0 42px; color: #ffffff; font: 700 clamp(28px, 5vw, 42px)/1.7 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; letter-spacing: .12em; white-space: nowrap; }
    #unity-progress-bar-empty { width: 100%; height: 2px; background: #30302d; }
    #unity-progress-bar-full { width: 0%; height: 100%; background: #ffffff; transition: width .2s linear; }
    #loading-status { min-height: 40px; margin-top: 18px; color: #ffffff; font: 12px/1.8 sans-serif; letter-spacing: .04em; }
    #unity-warning { position: fixed; z-index: 20; top: 16px; left: 5%; width: 90%; color: #eee; font: 13px/1.6 sans-serif; }
    .unity-mobile { width: 100%; height: 100%; }
    .unity-mobile #unity-canvas { width: 100%; height: 100%; }
    .unity-mobile #unity-footer { display: none; }
    @media (prefers-reduced-motion: reduce) { #unity-progress-bar-full { transition: none; } }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1" aria-label="복제인간 시 게임"></canvas>
    <div id="unity-footer"><button id="unity-fullscreen-button" type="button">전체 화면</button></div>
  </div>
  <div id="unity-loading-bar">
    <div class="loading-content">
      <h1>복제인간 시</h1>
      <div id="unity-progress-bar-empty" aria-hidden="true"><div id="unity-progress-bar-full"></div></div>
      <div id="loading-status" role="status" aria-live="polite">불러오는 중…</div>
    </div>
  </div>
  <div id="unity-warning" role="alert"></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    function showLoadError(message) {
      console.error(message);
      var status = document.querySelector("#loading-status");
      status.textContent = "불러오지 못했습니다. 다시 시도해 주세요.";
      var retry = document.createElement("button");
      retry.className = "retry"; retry.textContent = "다시 시도";
      retry.onclick = () => location.reload();
      status.append(document.createElement("br"), retry);
    }
    function unityShowBanner(message, type) {
      if (type === "error") showLoadError(message);
      else console.warn(message);
    }
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebDeveloperLatest.loader.js?v=f08585aeaf2127b7";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebDeveloperLatest.data",
      frameworkUrl: buildUrl + "/WebDeveloperLatest.framework.js",
      codeUrl: buildUrl + "/WebDeveloperLatest.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "HCP_Teaser",
      productVersion: "0.1.0",
      showBanner: unityShowBanner
    };
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      document.querySelector("#unity-container").className = "unity-mobile";
    } else {
      canvas.style.width = "min(960px, 100vw)";
      canvas.style.height = "min(600px, calc(100dvh - 36px))";
    }
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onerror = () => showLoadError("Loader download failed");
    script.onload = async () => {
        const manifest = {"dataUrl": [{"url": "Build/WebDeveloperLatest.data.part0?v=f033459cfbd9e161", "bytes": 67108864}, {"url": "Build/WebDeveloperLatest.data.part1?v=82e8767c8e318224", "bytes": 67108864}, {"url": "Build/WebDeveloperLatest.data.part2?v=9532d7ae41dc291a", "bytes": 12583040}], "frameworkUrl": [{"url": "Build/WebDeveloperLatest.framework.js?v=323341d4a65a9e17", "bytes": 799517}], "codeUrl": [{"url": "Build/WebDeveloperLatest.wasm?v=63c8c38f47d298f2", "bytes": 45109023}]};
        const total = Object.values(manifest).flat().reduce((n,p)=>n+p.bytes,0);
        let received = 0;
        const blobs = [];
        const loading = document.querySelector('#unity-loading-bar');
        const bar = document.querySelector('#unity-progress-bar-full');
        const status = document.querySelector('#loading-status') || document.createElement('div');
        status.setAttribute('role','status'); status.setAttribute('aria-live','polite');
        if(!status.isConnected){
          status.style.cssText='color:white;text-align:center;width:280px;margin:14px 0 0 -63px;font:14px sans-serif;line-height:1.6';
          loading.appendChild(status);
        }
        const mb = n => (n/1000000).toFixed(1);
        function draw(){const p=Math.min(100,Math.floor(received/total*100));bar.style.width=(p*.9)+'%';status.textContent='다운로드 '+p+'% · '+mb(received)+' / '+mb(total)+' MB';}
        draw();
        function failed(error){status.textContent='불러오지 못했습니다. 네트워크를 확인해 주세요.';const retry=document.createElement('button');retry.textContent='다시 시도';retry.onclick=()=>location.reload();status.appendChild(document.createElement('br'));status.appendChild(retry);console.error(error);}
        async function download(part){
          const response=await fetch(part.url);
          if(!response.ok)throw new Error('Download HTTP '+response.status);
          if(!response.body){const data=await response.arrayBuffer();received+=data.byteLength;draw();return data;}
          const reader=response.body.getReader();const buffers=[];
          for(;;){const {done,value}=await reader.read();if(done)break;buffers.push(value);received+=value.byteLength;draw();}
          return new Blob(buffers);
        }
        try {
          await Promise.all(Object.entries(manifest).map(async ([key,parts])=>{
            const data=await Promise.all(parts.map(download));
            const type=key==="codeUrl" && /\.wasm(?:\.part\d+)?(?:\?|$)/.test(parts[0].url) ? "application/wasm" : "application/octet-stream";
            const url=URL.createObjectURL(new Blob(data,{type}));blobs.push(url);config[key]=url;
          }));
          status.textContent='다운로드 완료 · 게임 준비 중…';
        } catch(error){failed(error);return;}

      createUnityInstance(canvas, config, (progress) => {
        document.querySelector("#unity-progress-bar-full").style.width = (90 + 10 * progress) + "%";
        document.querySelector("#loading-status").textContent = progress >= .9 ? "시작 준비 중…" : "불러오는 중 · " + Math.floor(progress * 100) + "%";
      }).then((unityInstance) => {
        blobs.forEach(url=>URL.revokeObjectURL(url)); document.querySelector("#unity-loading-bar").style.display = "none";
        document.querySelector("#unity-fullscreen-button").onclick = () => unityInstance.SetFullscreen(1);
      }).catch(showLoadError);
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
